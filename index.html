.bgfill img{width:100%;height:100%;object-fit:cover}
.maplink{position:absolute;border-radius:999px;z-index:5}
.maplink:focus-visible{outline:2px solid #fff;outline-offset:4px}

/* reveal */
[data-r]{opacity:0;translate:0 calc(var(--u)*36);transition:opacity 1.2s var(--ease),translate 1.4s var(--ease),clip-path 1.8s var(--ease)}
[data-r].in{opacity:1;translate:0 0}
.envelope[data-r]{translate:0 calc(var(--u)*90);scale:.96;transition:opacity 1.6s var(--ease),translate 1.8s var(--ease),scale 1.8s var(--ease)}
.envelope[data-r].in{scale:1}
.hands[data-r]{translate:0 calc(var(--u)*120);transition-duration:1.6s,2s}
.rib-in[data-r]{translate:-60% 0;opacity:0;transition:opacity 1.4s var(--ease),translate 2.4s var(--ease)}
.rib-in[data-r].in{translate:0 0}
.rib-hero[data-r]{translate:-25% calc(var(--u)*-20)}
.rib-hero[data-r].in{translate:0 0}
[data-wipe]{clip-path:inset(-20% 100% -20% 0)}
[data-wipe].in{clip-path:inset(-20% -5% -20% 0);transition:opacity .6s ease,translate 1.2s var(--ease),clip-path 2.2s cubic-bezier(.45,.05,.3,1)}

/* idle motion */
.pearl img{animation:float 6s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(calc(var(--u)*-9))}to{transform:translateY(calc(var(--u)*9))}}
.ball img{transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.star img{animation:twinkle 7s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.94) rotate(-3deg);opacity:.78}50%{transform:scale(1.04) rotate(3deg);opacity:1}}
.rib-hero img{animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(calc(var(--u)*-14)) rotate(-.6deg)}to{transform:translateX(calc(var(--u)*10)) rotate(.6deg)}}
.rib-in img{animation:drift 12s ease-in-out infinite alternate;animation-delay:-3s}
.envelope img{animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{transform:translateY(calc(var(--u)*-6))}to{transform:translateY(calc(var(--u)*6))}}
.par{will-change:transform}


/* countdown digits */
.timer{position:absolute;inset:0;pointer-events:none}
.dg{position:absolute;text-align:center;font-size:calc(var(--u)*125);line-height:1;color:var(--navy);font-variant-numeric:lining-nums tabular-nums;overflow:hidden;height:1.05em}
.dg span{display:inline-block}
.dg span.flip{animation:flip .6s var(--ease)}
@keyframes flip{from{transform:translateY(-.35em);opacity:0}to{transform:none;opacity:1}}

/* curtain */
.curtain{position:fixed;inset:0;z-index:50;pointer-events:auto;cursor:pointer}
.curtain .half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;transition:transform 2.2s cubic-bezier(.7,0,.2,1)}
.curtain .l{left:0;box-shadow:inset -18px 0 30px -18px rgba(0,0,0,.6)}
.curtain .r{right:0;box-shadow:inset 18px 0 30px -18px rgba(0,0,0,.6)}
.curtain .half img{position:absolute;top:0;height:100%;width:200%;object-fit:cover}
.curtain .l img{left:0}.curtain .r img{right:0}
.curtain .half:after{content:"";position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,rgba(230,230,240,.7),transparent)}
.curtain .l:after{right:0}.curtain .r:after{left:0}
.curtain .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;transition:opacity .8s ease,transform 1.2s var(--ease);z-index:2}
.curtain .mark img{width:min(46vw,210px);display:block;margin:0 auto}
.curtain .mark div{margin-top:18px;font-family:"CCBask",serif;font-size:13px;letter-spacing:.35em;color:rgba(255,255,255,.8);text-transform:uppercase;padding-left:.35em}
.curtain .mark{opacity:0;animation:markin 1.2s .2s var(--ease) forwards}
@keyframes markin{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}
.curtain.open .mark{opacity:0!important;animation:none}
.curtain.open .l{transform:translateX(-101%)}
.curtain.open .r{transform:translateX(101%)}
.curtain.gone{display:none}

@media (prefers-reduced-motion:reduce){
  [data-r],[data-wipe]{opacity:1!important;translate:none!important;scale:1!important;clip-path:none!important;transition:none!important}
  .L img{animation:none!important}
  .par{transform:none!important}
  .curtain{display:none}
}
</style>

<script>
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var els=[].slice.call(document.querySelectorAll('[data-r]'));
  var hero=els.filter(function(e){return e.hasAttribute('data-hero')});
  var started=false;

  /* scroll reveal */
  var io=null;
  function observe(){
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
    io=new IntersectionObserver(function(es){
      var vis=es.filter(function(e){return e.isIntersecting}).map(function(e){return e.target});
      vis.sort(function(a,b){return a.getBoundingClientRect().top-b.getBoundingClientRect().top});
      vis.forEach(function(t,i){t.style.transitionDelay=Math.min(i*0.12,0.9)+'s';t.classList.add('in');io.unobserve(t)});
    },{threshold:0,rootMargin:'0px 0px -12% 0px'});
    els.forEach(function(e){if(!e.hasAttribute('data-hero'))io.observe(e)});
  }
  function playHero(){
    var order={'envelope':0,'ball':1,'ribbon':1,'text':2,'script':3,'pearl':4,'star':4,'logo':5};
    hero.forEach(function(e){
      var k=e.classList[1];var d=(order[k]!=null?order[k]:3)*0.35;
      if(k==='text')d=0.9; if(k==='script')d=1.25;
      e.style.transitionDelay=d+'s';e.classList.add('in');
    });
  }
  function start(){if(started)return;started=true;document.body.classList.remove('lock');playHero();observe()}

  /* curtain */
  var c=document.getElementById('curtain');
  function open(){if(c.classList.contains('open'))return;c.classList.add('open');setTimeout(start,700);setTimeout(function(){c.classList.add('gone')},2400)}
  if(reduce){c.classList.add('gone');els.forEach(function(e){e.classList.add('in')});document.body.classList.remove('lock');started=true}
  else{c.addEventListener('click',open);window.addEventListener('load',function(){setTimeout(open,1300)});setTimeout(open,4500)}

  /* parallax */
  if(!reduce){
    var par=[].slice.call(document.querySelectorAll('.par'));
    var ticking=false;
    function upd(){ticking=false;var vh=innerHeight;
      for(var i=0;i<par.length;i++){var p=par[i],r=p.getBoundingClientRect();
        if(r.bottom<-200||r.top>vh+200)continue;
        var f=parseFloat(p.getAttribute('data-p'))||.08;var d=(r.top+r.height/2-vh/2)*-f;
        p.style.transform='translate3d(0,'+d.toFixed(1)+'px,0)';}
    }
    addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(upd)}},{passive:true});
    addEventListener('resize',upd);upd();
  }

  /* countdown: 17 Dec 2026 18:00 Almaty (UTC+5) */
  var target=new Date('2026-12-17T18:00:00+05:00').getTime();
  var spans=[].slice.call(document.querySelectorAll('.dg span'));
  function pad(n){return String(n).padStart(2,'0')}
  function tick(){
    var t=Math.max(0,target-Date.now());
    var v=[Math.floor(t/864e5),Math.floor(t/36e5)%24,Math.floor(t/6e4)%60,Math.floor(t/1e3)%60].map(pad);
    spans.forEach(function(s,i){if(s.textContent!==v[i]){s.textContent=v[i];if(!reduce){s.classList.remove('flip');void s.offsetWidth;s.classList.add('flip')}}});
  }
  tick();setInterval(tick,1000);
})();

</script>
