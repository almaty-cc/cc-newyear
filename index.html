/* 2. blur reveal (text only; nothing else is hidden) */

/* 3. metal flare */
.hasfl{overflow:visible}
.fl{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;

.fl.once{animation:none!important}
.fl.once.go{animation:sweep1 1.8s ease-in-out .6s 1 both!important}
@keyframes sweep{0%{background-position:150% 0}18%{background-position:-50% 0}100%{background-position:-50% 0}}

.dg{position:absolute;text-align:center;font-family:"CCBask",serif;font-size:calc(var(--W) / 1080 * 125);line-height:1;color:var(--navy);font-variant-numeric:lining-nums tabular-nums}

/* snow + sparkles */

/* music button */
#mus{position:fixed;z-index:40;right:calc((100vw - var(--W)) / 2 + 14px);bottom:calc(14px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,.55);background:rgba(3,24,58,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;opacity:0;transform:scale(.8);transition:opacity .8s ease,transform .8s var(--ease);box-shadow:0 6px 18px rgba(0,0,0,.25)}
#mus.show{opacity:1;transform:none}
#mus i{display:block;width:3px;height:6px;border-radius:2px;background:#fff;transition:height .3s}
#mus.play i{animation:eq 1s ease-in-out infinite alternate}
#mus.play i:nth-child(2){animation-delay:-.4s}#mus.play i:nth-child(3){animation-delay:-.7s}#mus.play i:nth-child(4){animation-delay:-.2s}
@keyframes eq{from{height:5px}to{height:18px}}

/* 1+5. intro: loader + envelope flap */

#intro .flap{position:absolute;inset:0;transform-origin:50% 0;transition:transform 1.7s cubic-bezier(.62,0,.28,1),opacity .6s ease 1.15s;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#06163a}
#intro .flap>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#intro .flap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55));opacity:0;transition:opacity 1.4s ease}
#intro.open{pointer-events:none}
#intro.open .flap{transform:rotateX(-96deg);opacity:0}
#intro.open .flap:after{opacity:1}

.box .logo img{animation:breathe 2.4s ease-in-out infinite alternate}
#intro.ready .box .logo img{animation:none}
@keyframes breathe{from{opacity:.45}to{opacity:1}}
.box .metal{opacity:0;filter:blur(10px);transition:opacity 1.6s var(--ease),filter 1.8s var(--ease)}
.box.lit .metal{opacity:1;filter:none}
.prog{position:absolute;left:30%;width:40%;top:calc(var(--bw) * 1420 / 1080);height:1px;background:rgba(255,255,255,.18);overflow:hidden;transition:opacity .6s}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(255,255,255,.4),#fff);transition:width .4s ease}
#intro.ready .prog{opacity:0}
.hint{position:absolute;left:0;right:0;top:calc(var(--bw) * 1395 / 1080);text-align:center;font-family:"CCMont",sans-serif;font-weight:300;font-size:calc(var(--bw) * 27 / 1080);letter-spacing:.22em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity 1s ease;padding-left:.22em}
#intro.ready .hint{opacity:1;animation:pulse 2.6s ease-in-out 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.tap{position:absolute;left:50%;top:calc(var(--bw) * 1530 / 1080);width:calc(var(--bw) * 70 / 1080);height:calc(var(--bw) * 70 / 1080);margin-left:calc(var(--bw) * -35 / 1080);border-radius:50%;border:1.5px solid rgba(255,255,255,.85);opacity:0;transition:opacity 1s ease}
.tap:before,.tap:after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);animation:ring 2.2s ease-out infinite}
.tap:after{animation-delay:1.1s}
.tap i{position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:#fff}
#intro.ready .tap{opacity:1}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}

<canvas id="fx" aria-hidden="true"></canvas>
<button id="mus" type="button" aria-label="Включить музыку"><i></i><i></i><i></i><i></i></button>
<audio id="audio" src="m/music.mp3" loop preload="auto"></audio>

<script>
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var intro=document.getElementById('intro'),box=document.getElementById('box'),bar=document.getElementById('bar');
  var audio=document.getElementById('audio'),mus=document.getElementById('mus');
  var opened=false,ready=false,t0=Date.now();

  /* ---------- 5. preloader ---------- */
  var imgs=[].slice.call(document.images),total=imgs.length+1,done=0;
  function step(){done++;bar.style.width=Math.min(100,done/total*100)+'%';if(done>=total)setReady()}
  imgs.forEach(function(im){if(im.complete)step();else{im.addEventListener('load',step,{once:true});im.addEventListener('error',step,{once:true})}});
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(step);
  setTimeout(setReady,9000);
  setTimeout(function(){box.classList.add('lit')},250);
  function setReady(){if(ready)return;ready=true;var wait=Math.max(0,1600-(Date.now()-t0));
    setTimeout(function(){intro.classList.add('ready');[].forEach.call(box.querySelectorAll('.hasfl'),function(e){e.classList.add('on')});setTimeout(function(){if(!opened)openIntro(false)},7000)},wait)}

  /* ---------- 1. open envelope ---------- */
  function openIntro(withMusic){
    if(opened)return;opened=true;
    if(withMusic)playMusic();
    intro.classList.add('open');
    burst(innerWidth/2,innerHeight*0.55,18);
    setTimeout(function(){document.body.classList.remove('lock');startPage()},700);
    setTimeout(function(){intro.classList.add('gone')},2100);
    mus.classList.add('show');if(!withMusic)mus.classList.add('hint');
  }
  intro.addEventListener('click',function(e){if(!ready&&Date.now()-t0<4000)return;openIntro(true)});
  intro.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openIntro(true)}});

  /* ---------- music ---------- */
  function fadeTo(v,ms){var s=audio.volume,st=performance.now();function f(t){var k=Math.min(1,(t-st)/ms);try{audio.volume=s+(v-s)*k}catch(e){}if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
  function playMusic(){try{audio.volume=0}catch(e){}var p=audio.play();if(p&&p.then)p.then(function(){fadeTo(.7,2500);setMus(true)}).catch(function(){setMus(false);mus.classList.add('hint')});else setMus(true)}
  function setMus(on){mus.classList.toggle('play',on);mus.classList.remove('hint');mus.setAttribute('aria-label',on?'Выключить музыку':'Включить музыку')}
  mus.addEventListener('click',function(){if(audio.paused){playMusic()}else{audio.pause();setMus(false)}});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&!audio.paused){audio.pause();audio.dataset.resume='1'}else if(!document.hidden&&audio.dataset.resume){audio.dataset.resume='';audio.play().catch(function(){})}});

  /* ---------- 2. blur reveal + 3. flare activation ---------- */
  function startPage(){
    var hero=[].slice.call(document.querySelectorAll('.stage [data-hero]'));
    hero.sort(function(a,b){return a.offsetTop-b.offsetTop});
    hero.forEach(function(e,i){e.style.transitionDelay=(0.25+i*0.3)+'s';e.classList.add('in')});
    var env=document.querySelector('.stage .envelope .fl');if(env)env.classList.add('go');
    var bl=[].slice.call(document.querySelectorAll('.stage .bl:not([data-hero])'));
    var fl=[].slice.call(document.querySelectorAll('.stage .hasfl'));
    if(!('IntersectionObserver' in window)){bl.forEach(function(e){e.classList.add('in')});fl.forEach(function(e){e.classList.add('on')});return}
    var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}})},{rootMargin:'0px 0px -6% 0px'});
    bl.forEach(function(e){io.observe(e)});
    var io2=new IntersectionObserver(function(es){es.forEach(function(en){en.target.classList.toggle('on',en.isIntersecting)})});
    fl.forEach(function(e){io2.observe(e)});
    startSnow();
  }

  /* ---------- countdown: 17 Dec 2026 18:00 Almaty (UTC+5) ---------- */
  var target=new Date('2026-12-17T18:00:00+05:00').getTime(),spans=[].slice.call(document.querySelectorAll('.dg span'));
  function pad(n){return String(n).padStart(2,'0')}
  function tick(){var t=Math.max(0,target-Date.now());var v=[Math.floor(t/864e5),Math.floor(t/36e5)%24,Math.floor(t/6e4)%60,Math.floor(t/1e3)%60].map(pad);spans.forEach(function(s,i){if(s.textContent!==v[i])s.textContent=v[i]})}
  tick();setInterval(tick,1000);

  /* ---------- snow + 4. sparkle trail (one canvas) ---------- */
  var c=document.getElementById('fx'),x=c.getContext('2d'),W=0,Hh=0,dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){W=innerWidth;Hh=innerHeight;c.width=W*dpr;c.height=Hh*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  var weak=(navigator.hardwareConcurrency||4)<=4,N=reduce?0:(weak?22:38);
  var flakes=[],sparks=[],snowOn=false,running=false;
  function mk(top){var r=Math.random();return{x:Math.random()*W,y:top?-10:Math.random()*Hh,r:1+r*r*2.6,v:.25+Math.random()*.55,w:Math.random()*6.28,ws:.004+Math.random()*.01,a:.45+Math.random()*.45}}
  function startSnow(){if(snowOn||!N)return;snowOn=true;for(var i=0;i<N;i++)flakes.push(mk(false));loop()}
  function spark(px,py,n){if(reduce)return;for(var i=0;i<n;i++){if(sparks.length>70)sparks.shift();var ang=Math.random()*6.28,sp=Math.random()*.8;
    sparks.push({x:px+(Math.random()-.5)*10,y:py+(Math.random()-.5)*10,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-.35,s:2+Math.random()*3.5,t:0,life:550+Math.random()*350,g:Math.random()<.3})}loop()}
  function burst(px,py,n){if(reduce)return;for(var i=0;i<n;i++){var ang=Math.random()*6.28,sp=1+Math.random()*2.5;sparks.push({x:px,y:py,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,s:2.5+Math.random()*4,t:0,life:800+Math.random()*500,g:Math.random()<.35})}loop()}
  var last=0;
  function onMove(px,py){var now=performance.now();if(now-last<28)return;last=now;spark(px,py,2)}
  addEventListener('pointermove',function(e){if(opened)onMove(e.clientX,e.clientY)},{passive:true});
  addEventListener('touchmove',function(e){if(opened&&e.touches[0])onMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  addEventListener('pointerdown',function(e){if(opened)spark(e.clientX,e.clientY,6)},{passive:true});
  function star(px,py,s,a,gold){
    x.save();x.translate(px,py);x.globalAlpha=a;
    var col=gold?'255,236,190':'255,255,255';
    var g=x.createRadialGradient(0,0,0,0,0,s*1.6);g.addColorStop(0,'rgba('+col+',.9)');g.addColorStop(1,'rgba('+col+',0)');
    x.fillStyle=g;x.beginPath();x.arc(0,0,s*1.6,0,6.283);x.fill();
    x.fillStyle='rgba('+col+',1)';x.beginPath();
    x.moveTo(0,-s*2);x.quadraticCurveTo(0,0,s*2,0);x.quadraticCurveTo(0,0,0,s*2);x.quadraticCurveTo(0,0,-s*2,0);x.quadraticCurveTo(0,0,0,-s*2);x.fill();
    x.restore();
  }
  var prev=0;
  function loop(){if(running)return;running=true;prev=performance.now();requestAnimationFrame(frame)}
  function frame(now){
    var dt=Math.min(50,now-prev);prev=now;var k=dt/16.7;
    x.clearRect(0,0,W,Hh);
    for(var i=0;i<flakes.length;i++){var f=flakes[i];f.y+=f.v*k;f.w+=f.ws*k;f.x+=Math.sin(f.w)*.35*k;
      if(f.y>Hh+8){flakes[i]=mk(true);continue}
      x.beginPath();x.arc(f.x,f.y,f.r+1.2,0,6.283);x.fillStyle='rgba(60,90,150,'+(f.a*.18)+')';x.fill();
      x.beginPath();x.arc(f.x,f.y,f.r,0,6.283);x.fillStyle='rgba(255,255,255,'+f.a+')';x.fill();}
    for(var j=sparks.length-1;j>=0;j--){var p=sparks[j];p.t+=dt;if(p.t>p.life){sparks.splice(j,1);continue}
      p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=.97;p.vy*=.97;var q=p.t/p.life;star(p.x,p.y,p.s*(1-q*.6),(1-q)*(q<.15?q/.15:1),p.g)}
    if(flakes.length||sparks.length)requestAnimationFrame(frame);else{running=false;x.clearRect(0,0,W,Hh)}
  }
})();
</script>
